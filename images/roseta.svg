    <circle cx="140" cy="125" r="7"><animate attributeName="opacity" values=".4;1;.4" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="130" r="7"><animate attributeName="opacity" values="1;.4;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="117" r="7"><animate attributeName="opacity" values=".4;1;.4" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="95" r="7"><animate attributeName="opacity" values="1;.4;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="570" cy="86" r="7"><animate attributeName="opacity" values=".4;1;.4" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="85" r="7"><animate attributeName="opacity" values="1;.4;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="90" r="7"><animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"/></circle>
