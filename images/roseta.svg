    <circle cx="160" cy="348" r="14" fill="#ff7a59"/><circle cx="160" cy="348" r="8" fill="#ffd27a"/>
    <ellipse cx="235" cy="350" rx="26" ry="9" fill="#e9eef3"/><path d="M220 346 q15 -16 30 0z" fill="#ff4f7b"/>
