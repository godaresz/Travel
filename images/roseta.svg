<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2a6b"/><stop offset=".45" stop-color="#c2477a"/><stop offset=".75" stop-color="#ff9f6e"/><stop offset="1" stop-color="#ffd27a"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8778a"/><stop offset="1" stop-color="#3b2a6b"/></linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <g fill="#fff"><circle cx="90" cy="50" r="1.6"/><circle cx="200" cy="30" r="1.2"/><circle cx="330" cy="60" r="1.4"/><circle cx="700" cy="40" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle></g>
