<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fd0e0"/><stop offset=".5" stop-color="#1584c4"/><stop offset="1" stop-color="#062f53"/></linearGradient>
    <radialGradient id="ray" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sea)"/>
  <g fill="url(#ray)" opacity=".7">
    <path d="M180 0 L260 0 L380 450 L160 450 Z"><animate attributeName="opacity" values=".4;.9;.4" dur="5s" repeatCount="indefinite"/></path>
    <path d="M460 0 L520 0 L640 450 L470 450 Z"><animate attributeName="opacity" values=".8;.3;.8" dur="6s" repeatCount="indefinite"/></path>
  </g>
  <!-- sand + coral -->
  <path d="M0 390 Q200 360 400 385 T800 380 V450 H0 Z" fill="#f7cf8d"/>
  <g fill="#ff7a59">
    <path d="M90 395 q-10 -60 10 -90 q8 30 -2 50 q20 -30 30 -60 q6 50 -14 100 z"/>
    <path d="M650 392 q0 -50 20 -80 q4 30 -6 46 q16 -24 30 -40 q-4 46 -24 76 z" fill="#ff4f7b"/>
  </g>
  <g stroke="#12c2b4" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M200 400 q-15 -40 5 -80 q15 -30 -5 -60"><animateTransform attributeName="transform" type="skewX" values="0;4;0;-4;0" dur="5s" repeatCount="indefinite"/></path>
    <path d="M560 400 q15 -40 -5 -70 q-15 -30 5 -60"><animateTransform attributeName="transform" type="skewX" values="0;-4;0;4;0" dur="6s" repeatCount="indefinite"/></path>
  </g>
  <!-- fish -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-120 0;920 -20" dur="12s" repeatCount="indefinite"/>
    <g transform="translate(0 160)"><ellipse cx="0" cy="0" rx="38" ry="22" fill="#ffc94d"/><path d="M-34 0 l-26 -18 v36 z" fill="#ffb020"/><rect x="-8" y="-22" width="10" height="44" fill="#fff" opacity=".9"/><circle cx="22" cy="-5" r="5" fill="#062f53"/></g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="900 0;-140 30" dur="16s" repeatCount="indefinite"/>
    <g transform="translate(0 250) scale(-1 1)"><ellipse cx="0" cy="0" rx="30" ry="16" fill="#ff7a59"/><path d="M-26 0 l-20 -14 v28 z" fill="#ff4f7b"/><rect x="-4" y="-16" width="8" height="32" fill="#fff"/><circle cx="16" cy="-4" r="4" fill="#062f53"/></g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="-80 0;880 10" dur="20s" begin="-8s" repeatCount="indefinite"/>
    <g transform="translate(0 300)" fill="#7fe7e0"><ellipse cx="0" cy="0" rx="18" ry="9"/><path d="M-15 0 l-12 -8 v16 z"/><ellipse cx="40" cy="-14" rx="14" ry="7"/><path d="M28 -14 l-10 -6 v12 z"/></g>
  </g>
  <!-- turtle -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;30 -14;0 0" dur="7s" repeatCount="indefinite"/>
    <g transform="translate(470 120)"><ellipse rx="48" ry="30" fill="#2e8b57"/><ellipse rx="38" ry="22" fill="#3fae6d"/><circle cx="56" cy="-4" r="13" fill="#5cc48a"/><ellipse cx="-20" cy="30" rx="18" ry="8" fill="#5cc48a"/><ellipse cx="22" cy="-30" rx="18" ry="8" fill="#5cc48a"/></g>
  </g>
  <!-- bubbles -->
  <g fill="none" stroke="#fff" stroke-width="2" opacity=".8">
    <circle cx="300" cy="420" r="6"><animate attributeName="cy" values="420;-10" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="420" r="4"><animate attributeName="cy" values="420;-10" dur="5s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="420" r="5"><animate attributeName="cy" values="420;-10" dur="7s" begin="-4s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="270" y="24" width="260" height="48" rx="24" fill="#062f53" opacity=".55"/>
  <text x="400" y="57" font-family="Kanit,Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">BANGSAEN AQUARIUM</text>
</svg>
