<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6cc9f0"/><stop offset="1" stop-color="#c8f0ff"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1fa6d6"/><stop offset="1" stop-color="#7fe7e0"/></linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="110" cy="80" r="44" fill="#ffd54d"><animate attributeName="r" values="42;48;42" dur="4s" repeatCount="indefinite"/></circle>
  <g fill="#fff" opacity=".9"><g><ellipse cx="520" cy="70" rx="70" ry="18"/><ellipse cx="555" cy="58" rx="38" ry="20"/><animateTransform attributeName="transform" type="translate" values="0 0;-50 0;0 0" dur="18s" repeatCount="indefinite"/></g></g>
  <!-- S2 hotel in background -->
  <rect x="600" y="110" width="150" height="150" rx="6" fill="#f3f6f9"/>
  <g fill="#7fc4e8"><rect x="615" y="125" width="30" height="20"/><rect x="660" y="125" width="30" height="20"/><rect x="705" y="125" width="30" height="20"/><rect x="615" y="160" width="30" height="20"/><rect x="660" y="160" width="30" height="20"/><rect x="705" y="160" width="30" height="20"/><rect x="615" y="195" width="30" height="20"/><rect x="660" y="195" width="30" height="20"/><rect x="705" y="195" width="30" height="20"/></g>
  <text x="675" y="248" font-family="Kanit,Arial,sans-serif" font-size="22" font-weight="800" fill="#0a4a7a" text-anchor="middle">S2</text>
  <!-- sea -->
  <rect y="230" width="800" height="90" fill="url(#sea)"/>
  <path d="M0 250 q25 -10 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" stroke="#fff" stroke-width="3" fill="none" opacity=".7"><animateTransform attributeName="transform" type="translate" values="0 0;-100 0" dur="4s" repeatCount="indefinite"/></path>
  <path d="M0 300 Q100 285 200 300 T400 300 T600 300 T800 300 T1000 300 V330 H0 Z" fill="#fff" opacity=".85"><animateTransform attributeName="transform" type="translate" values="0 0;-200 0" dur="6s" repeatCount="indefinite"/></path>
  <!-- sand -->
  <path d="M0 310 Q200 295 400 312 T800 305 V450 H0 Z" fill="#ffe3b3"/>
  <g fill="#f2c27a" opacity=".6"><circle cx="120" cy="380" r="3"/><circle cx="300" cy="410" r="3"/><circle cx="520" cy="370" r="3"/><circle cx="690" cy="420" r="3"/></g>
  <!-- palm -->
  <g>
    <path d="M70 450 q10 -120 40 -200" stroke="#9b6a3a" stroke-width="14" fill="none" stroke-linecap="round"/>
    <g fill="#2fae6a"><animateTransform attributeName="transform" type="rotate" values="-3 110 250;3 110 250;-3 110 250" dur="4s" repeatCount="indefinite"/>
      <path d="M110 250 q-60 -30 -110 10 q60 -10 110 -10z"/><path d="M110 250 q50 -50 120 -20 q-70 0 -120 20z"/><path d="M110 250 q-20 -60 20 -100 q-10 50 -20 100z"/><path d="M110 250 q60 0 90 50 q-50 -30 -90 -50z"/></g>
  </g>
  <!-- umbrella + deckchairs -->
  <line x1="380" y1="250" x2="390" y2="390" stroke="#555" stroke-width="5"/>
  <path d="M290 260 Q385 170 480 250 Z" fill="#ff7a59"/>
  <path d="M322 236 Q385 175 448 236" fill="none" stroke="#fff" stroke-width="10" opacity=".8"/>
  <g stroke="#0a4a7a" stroke-width="5"><path d="M320 390 l40 -40 h70" fill="none"/><path d="M450 395 l40 -40 h70" fill="none"/></g>
  <g fill="#12c2b4"><path d="M330 380 l35 -32 h60 l-10 32 z"/><path d="M460 385 l35 -32 h60 l-10 32 z"/></g>
  <!-- lunch box -->
  <rect x="560" y="380" width="70" height="40" rx="6" fill="#fff" stroke="#ff7a59" stroke-width="4"/>
  <rect x="570" y="390" width="22" height="20" fill="#ffd54d"/><rect x="598" y="390" width="22" height="20" fill="#7cc46b"/>
  <!-- ball -->
  <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -30;0 0" dur="1.4s" repeatCount="indefinite"/>
    <circle cx="230" cy="380" r="22" fill="#fff"/><path d="M208 380 a22 22 0 0 1 44 0z" fill="#ff4f7b"/><path d="M216 365 a22 22 0 0 1 28 0 l-14 15z" fill="#ffc94d"/></g>
</svg>
